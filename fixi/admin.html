<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fixi — Admin Dashboard</title>

<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%234f46e5'/%3E%3Cstop offset='50%25' stop-color='%237c3aed'/%3E%3Cstop offset='100%25' stop-color='%2306b6d4'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect x='4' y='4' width='92' height='92' rx='22' fill='url(%23g)'/%3E%3Cpath d='M 50 22 L 78 46 L 71 46 L 71 76 Q 71 78 69 78 L 31 78 Q 29 78 29 76 L 29 46 L 22 46 Z' fill='%23ffffff'/%3E%3Cpath d='M 38 60 L 47 69 L 63 51' fill='none' stroke='%234f46e5' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<meta name="theme-color" content="#4f46e5">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#f5f7ff;
  --card:rgba(255,255,255,.78);
  --text:#101322;
  --muted:#6d7285;
  --border:rgba(20,25,50,.09);
  --primary:#635bff;
  --purple:#8b5cf6;
  --cyan:#06b6d4;
  --pink:#ec4899;
  --danger:#ef4444;
  --success:#10b981;
  --warning:#f59e0b;
  --shadow:0 20px 60px rgba(40,45,100,.10);
}

body.dark{
  --bg:#070914;
  --card:rgba(18,22,42,.82);
  --text:#f5f7ff;
  --muted:#9ba2bb;
  --border:rgba(255,255,255,.08);
  --shadow:0 20px 60px rgba(0,0,0,.35);
}

body{
  font-family:Inter,Segoe UI,Arial,sans-serif;
  background:
    radial-gradient(circle at 10% 0%,rgba(99,91,255,.15),transparent 30%),
    radial-gradient(circle at 90% 10%,rgba(6,182,212,.12),transparent 30%),
    var(--bg);
  color:var(--text);
  min-height:100vh;
}

/* =========================
   LOGIN — MINECRAFT THEME
========================= */

#loginPage{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  position:relative;
  overflow:hidden;

  background:
    radial-gradient(2px 2px at 10% 12%, #ffffff, transparent 60%),
    radial-gradient(2px 2px at 25% 6%, #ffffff, transparent 60%),
    radial-gradient(2px 2px at 42% 18%, #e0e0ff, transparent 60%),
    radial-gradient(2px 2px at 58% 8%, #ffffff, transparent 60%),
    radial-gradient(2px 2px at 73% 20%, #ffffff, transparent 60%),
    radial-gradient(2px 2px at 88% 4%, #e0e0ff, transparent 60%),
    radial-gradient(2px 2px at 15% 30%, #ffffff, transparent 60%),
    radial-gradient(2px 2px at 35% 34%, #ffffff, transparent 60%),
    radial-gradient(2px 2px at 52% 38%, #e0e0ff, transparent 60%),
    radial-gradient(2px 2px at 70% 28%, #ffffff, transparent 60%),
    radial-gradient(2px 2px at 92% 42%, #ffffff, transparent 60%),
    radial-gradient(2px 2px at 6% 52%, #ffffff, transparent 60%),
    radial-gradient(2px 2px at 48% 56%, #e0e0ff, transparent 60%),
    radial-gradient(2px 2px at 82% 62%, #ffffff, transparent 60%),
    radial-gradient(circle at 82% 14%, rgba(255,255,240,.9) 0, rgba(255,255,240,.6) 14px, rgba(255,255,240,.15) 28px, transparent 60px),
    linear-gradient(180deg, #0a1024 0%, #101a34 30%, #182448 55%, #1f2f5c 75%, #263a6b 100%);
  image-rendering: pixelated;
}

#loginPage::after{
  content:"";
  position:absolute;
  left:0;
  right:0;
  bottom:70px;
  height:180px;
  background:
    linear-gradient(135deg, transparent 50%, #0d1530 50%) 0 0 / 90px 100% repeat-x,
    linear-gradient(45deg, #0d1530 50%, transparent 50%) 45px 0 / 90px 100% repeat-x;
  z-index:0;
  pointer-events:none;
  opacity:.85;
}

#loginPage::before{
  content:"";
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:70px;
  background:
    linear-gradient(180deg,
      #7cbb4f 0px,
      #5e9c3e 10px,
      #4a7d31 18px,
      #8b5a2b 18px,
      #7a4f25 40px,
      #6b4423 70px
    );
  box-shadow:
    inset 0 8px 0 rgba(0,0,0,.18),
    inset 0 -6px 0 rgba(0,0,0,.35);
  z-index:0;
  pointer-events:none;
  image-rendering: pixelated;
}

.login-card{
  width:100%;
  max-width:430px;
  padding:0 0 32px;
  text-align:center;
  position:relative;
  z-index:1;
  overflow:hidden;

  background:#8b5a2b;
  background-image:
    repeating-linear-gradient(0deg,
      #8b5a2b 0px, #8b5a2b 8px,
      #7a4f25 8px, #7a4f25 16px),
    repeating-linear-gradient(90deg,
      rgba(0,0,0,.08) 0px, rgba(0,0,0,.08) 8px,
      transparent 8px, transparent 16px);

  border-radius:4px;

  border:4px solid #2b1a0a;
  box-shadow:
    inset 0 0 0 4px #a06b38,
    inset 0 0 0 8px #6b4423,
    0 0 0 4px #2b1a0a,
    0 16px 0 rgba(0,0,0,.4),
    0 24px 60px rgba(0,0,0,.55);

  animation:cardIn .6s cubic-bezier(.22,1,.36,1);
  image-rendering: pixelated;
}

.login-card::before{
  content:"";
  position:absolute;
  top:0;
  left:0;
  right:0;
  height:28px;
  background:
    linear-gradient(180deg, #7cbb4f 0px, #5e9c3e 14px, #4a7d31 22px, #3d6b28 28px);
  border-bottom:4px solid #2b1a0a;
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.25);
  z-index:1;
  pointer-events:none;
  image-rendering: pixelated;
}

.login-card::after{
  content:"";
  position:absolute;
  inset:12px;
  border-radius:2px;
  background-image:
    linear-gradient(to right, rgba(0,0,0,.10) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(0,0,0,.10) 1px, transparent 1px);
  background-size:8px 8px;
  pointer-events:none;
  z-index:0;
}

@keyframes cardIn{
  from{
    opacity:0;
    transform:translateY(20px) scale(.97);
  }
  to{
    opacity:1;
    transform:translateY(0) scale(1);
  }
}

.logo{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
  margin:56px 0 22px;
  position:relative;
  z-index:2;
}

.logo-mark{
  width:44px;
  height:44px;
  position:relative;
  flex:none;
  image-rendering: pixelated;
}

.logo-mark::before{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(180deg,
      #8fd35b 0%,
      #7cbb4f 20%,
      #5e9c3e 40%,
      #4a7d31 55%,
      transparent 55%
    ),
    repeating-conic-gradient(
      #8b5a2b 0% 25%,
      #7a4f25 0% 50%,
      #a06b38 0% 75%,
      #6b4423 0% 100%
    );
  background-size:100% 100%, 8px 8px;
  background-position:0 0, 0 0;
  box-shadow:
    inset -4px -4px 0 rgba(0,0,0,.35),
    inset 4px 4px 0 rgba(255,255,255,.15),
    inset 0 0 0 3px #3d2a12,
    0 4px 0 #2b1a0a,
    0 6px 12px rgba(0,0,0,.5);
  border-radius:3px;
  z-index:0;
}

.logo-mark::after{
  content:"";
  position:absolute;
  inset:0;
  background-image:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M 50 20 L 82 48 L 74 48 L 74 80 Q 74 82 72 82 L 28 82 Q 26 82 26 80 L 26 48 L 18 48 Z' fill='%23ffffff' stroke='%232b1a0a' stroke-width='4' stroke-linejoin='round'/%3E%3Cpath d='M 38 60 L 47 70 L 64 50' fill='none' stroke='%232b1a0a' stroke-width='8' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
  background-size:70% 70%;
  background-repeat:no-repeat;
  background-position:center;
  image-rendering: pixelated;
  z-index:1;
  filter:drop-shadow(1px 1px 0 rgba(0,0,0,.4));
}

.logo-text{
  font-size:34px;
  line-height:44px;
  height:44px;
  display:flex;
  align-items:center;
  font-weight:800;
  letter-spacing:-0.5px;
  color:#7cbb4f;
  font-family:"Poppins","Sora","Plus Jakarta Sans",Inter,sans-serif;
  text-shadow:
    2px 2px 0 #2b1a0a,
    0 0 12px rgba(124,187,79,.55);
}

.login-card h1{
  font-size:22px;
  margin:0 0 26px;
  text-align:center;
  color:#f0e6d2;
  font-family:"Courier New",monospace;
  font-weight:900;
  letter-spacing:2px;
  text-shadow:
    2px 2px 0 #3a2a10,
    4px 4px 0 rgba(0,0,0,.3);
  position:relative;
  z-index:2;
}

.field{
  margin:0 32px 16px;
  text-align:left;
  position:relative;
  z-index:2;
}

.field label{
  display:block;
  margin-bottom:8px;
  font-size:12px;
  font-weight:900;
  color:#f0e6d2;
  font-family:"Courier New",monospace;
  letter-spacing:2px;
  text-transform:uppercase;
  text-shadow:1px 1px 0 rgba(0,0,0,.7);
  transition:color .3s, transform .3s;
}

.field:focus-within label{
  color:#a8e06a;
  transform:translateX(3px);
}

.input-wrap{
  position:relative;
  display:flex;
  align-items:center;
}

/* Icons — always black */
.input-icon{
  position:absolute;
  left:12px;
  width:16px;
  height:16px;
  color:#000000;
  transition:color .25s, transform .25s;
  pointer-events:none;
  z-index:2;
}

.field:focus-within .input-icon{
  color:#000000;
  transform:scale(1.1);
}

/* Eye toggle — hidden by default, black color */
.toggle-eye{
  position:absolute;
  right:10px;
  width:22px;
  height:22px;
  border:none;
  background:transparent;
  padding:0;
  cursor:pointer;
  color:#000000;
  display:none;
  place-items:center;
  z-index:3;
  transition:color .25s, transform .25s;
}

.toggle-eye.visible{
  display:grid;
}

.toggle-eye:hover{
  color:#000000;
  transform:scale(1.15);
}

.toggle-eye svg{
  width:18px;
  height:18px;
  display:block;
}

.field input,
.search-input,
.filter-select{
  width:100%;
  padding:12px 38px 12px 38px;
  border-radius:3px;
  border:3px solid #2b1a0a;
  outline:none;
  background:#c8b08a;
  color:#2b1a0a;
  font-size:14px;
  font-family:Inter,Segoe UI,Arial,sans-serif;
  font-weight:600;
  box-shadow:
    inset 2px 2px 0 rgba(255,255,255,.25),
    inset -2px -2px 0 rgba(0,0,0,.25),
    0 2px 0 rgba(0,0,0,.4);
  transition:border-color .2s, box-shadow .2s, transform .2s;
  image-rendering: pixelated;
}

.field input::placeholder{
  color:#6b4423;
  opacity:.85;
  font-family:Inter,Segoe UI,Arial,sans-serif;
}

.field input:hover,
.search-input:hover,
.filter-select:hover{
  border-color:#4a2e14;
}

body.dark .field input,
body.dark .search-input,
body.dark .filter-select{
  background:#c8b08a;
  color:#2b1a0a;
}

.field input:focus,
.search-input:focus,
.filter-select:focus{
  border-color:#7cbb4f;
  box-shadow:
    inset 2px 2px 0 rgba(255,255,255,.25),
    inset -2px -2px 0 rgba(0,0,0,.25),
    0 0 0 3px rgba(124,187,79,.45);
  transform:translateY(-1px);
  background:#d8c39c;
}

body.dark .field input:focus{
  background:#d8c39c;
}

.field::after{
  content:none;
}

.primary-btn{
  width:calc(100% - 64px);
  border:3px solid #2b1a0a;
  padding:14px;
  border-radius:3px;
  background:linear-gradient(180deg,#7cbb4f 0%,#5e9c3e 50%,#4a7d31 100%);
  color:#ffffff;
  font-size:15px;
  font-weight:900;
  font-family:"Courier New",monospace;
  letter-spacing:2px;
  text-transform:uppercase;
  cursor:pointer;
  transition:.15s;
  position:relative;
  overflow:hidden;
  margin:10px 32px 0;
  text-shadow:2px 2px 0 rgba(0,0,0,.5);
  box-shadow:
    inset 2px 2px 0 rgba(255,255,255,.3),
    inset -2px -2px 0 rgba(0,0,0,.3),
    0 4px 0 #2b1a0a;
  image-rendering: pixelated;
  z-index:2;
}

.primary-btn::after{
  content:none;
}

.primary-btn:hover{
  transform:translateY(-2px);
  box-shadow:
    inset 2px 2px 0 rgba(255,255,255,.3),
    inset -2px -2px 0 rgba(0,0,0,.3),
    0 6px 0 #2b1a0a;
  filter:brightness(1.08);
}

.primary-btn:active{
  transform:translateY(2px);
  box-shadow:
    inset 2px 2px 0 rgba(255,255,255,.3),
    inset -2px -2px 0 rgba(0,0,0,.3),
    0 2px 0 #2b1a0a;
}

.primary-btn:disabled{
  opacity:0.6;
  cursor:not-allowed;
  transform:none;
  box-shadow:
    inset 2px 2px 0 rgba(255,255,255,.3),
    inset -2px -2px 0 rgba(0,0,0,.3),
    0 4px 0 #2b1a0a;
}

.error{
  color:#ff5555;
  font-size:12px;
  margin:12px 32px 0;
  min-height:18px;
  text-align:center;
  font-family:"Courier New",monospace;
  font-weight:900;
  text-shadow:1px 1px 0 rgba(0,0,0,.7);
  position:relative;
  z-index:2;

  animation:shake .4s ease;
}

@keyframes shake{
  0%,100%{transform:translateX(0);}
  25%{transform:translateX(-4px);}
  75%{transform:translateX(4px);}
}

/* =========================
   DASHBOARD
========================= */

#dashboard{
  display:none;
}

.topbar{
  position:sticky;
  top:0;
  z-index:10;
  border-bottom:1px solid var(--border);
  background:rgba(245,247,255,.75);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
}

body.dark .topbar{
  background:rgba(7,9,20,.75);
}

.topbar-inner{
  max-width:1400px;
  margin:auto;
  padding:15px 24px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.brand{
  display:flex;
  align-items:center;
  gap:7px;
}

.brand .logo-mark{
  width:36px;
  height:36px;
  border-radius:12px;
}

.brand strong{
  font-size:28px;
  font-weight:950;
  letter-spacing:-2px;
  background:linear-gradient(110deg,#4f46e5,#7c3aed,#06b6d4);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  font-family:"Sora","Plus Jakarta Sans","Cairo",sans-serif;
}

.admin-label{
  color:var(--muted);
  font-size:12px;
  margin-left:5px;
}

.top-actions{
  display:flex;
  gap:8px;
}

.icon-btn{
  width:42px;
  height:42px;
  border:1px solid var(--border);
  border-radius:13px;
  background:var(--card);
  color:var(--text);
  cursor:pointer;
  font-size:17px;
  transition:transform .2s, box-shadow .2s;
}

.icon-btn:hover{
  transform:translateY(-2px) scale(1.04);
  box-shadow:0 8px 20px rgba(99,91,255,.15);
}

.logout-btn{
  border:1px solid rgba(239,68,68,.2);
  background:rgba(239,68,68,.08);
  color:#ef4444;
  padding:11px 14px;
  border-radius:12px;
  cursor:pointer;
  font-weight:700;
  transition:transform .2s, background .2s;
}

.logout-btn:hover{
  transform:translateY(-2px);
  background:rgba(239,68,68,.15);
}

.container{
  max-width:1400px;
  margin:auto;
  padding:30px 24px 50px;
}

.hero{
  margin-bottom:28px;
  text-align:center;

  animation:cardIn .6s cubic-bezier(.22,1,.36,1);
}

.hero h1{
  font-size:34px;
  letter-spacing:-1.2px;
  margin-bottom:6px;
}

.hero p{
  color:var(--muted);
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:16px;
  margin-bottom:25px;
}

.stat{
  padding:24px;
  border-radius:22px;
  background:var(--card);
  border:1px solid var(--border);
  box-shadow:var(--shadow);
  text-align:center;

  animation:cardIn .6s cubic-bezier(.22,1,.36,1) backwards;
  transition:transform .3s, box-shadow .3s;
}

.stat:hover{
  transform:translateY(-4px);
  box-shadow:0 25px 70px rgba(99,91,255,.15);
}

.stat:nth-child(1){animation-delay:.05s;}
.stat:nth-child(2){animation-delay:.10s;}
.stat:nth-child(3){animation-delay:.15s;}
.stat:nth-child(4){animation-delay:.20s;}

.stat-label{
  color:var(--muted);
  font-size:13px;
  font-weight:700;
  margin-bottom:9px;
}

.stat-value{
  font-size:30px;
  font-weight:900;
}

.toolbar{
  display:grid;
  grid-template-columns:1fr 180px 180px;
  gap:12px;
  margin-bottom:18px;
}

.toolbar input,
.toolbar select{
  padding-left:15px !important;
}

.filter-select option,
.status-select option{
  background-color:#ffffff;
  color:#101322;
}

body.dark .filter-select option,
body.dark .status-select option{
  background-color:#151827;
  color:#f5f7ff;
}

.panel{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:22px;
  box-shadow:var(--shadow);
  overflow:hidden;

  animation:cardIn .6s cubic-bezier(.22,1,.36,1) .25s backwards;
}

.table-wrap{
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:950px;
}

th,
td{
  padding:16px 15px;
  text-align:left;
  border-bottom:1px solid var(--border);
  font-size:13px;
  white-space:nowrap;
}

th{
  color:var(--muted);
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.6px;
  background:rgba(99,91,255,.035);
}

tbody tr{
  transition:.15s;
}

tbody tr:hover{
  background:rgba(99,91,255,.045);
}

.customer-name{
  font-weight:800;
}

.customer-phone{
  color:var(--muted);
  margin-top:3px;
}

.status{
  display:inline-flex;
  align-items:center;
  padding:7px 10px;
  border-radius:999px;
  font-size:11px;
  font-weight:800;
}

.status.pending{
  color:#b77900;
  background:rgba(245,158,11,.12);
}

.status.confirmed{
  color:#087f5b;
  background:rgba(16,185,129,.12);
}

.status.completed{
  color:#2563eb;
  background:rgba(37,99,235,.12);
}

.status.cancelled{
  color:#dc2626;
  background:rgba(239,68,68,.12);
}

.status-select{
  border:1px solid var(--border);
  border-radius:99px;
  padding:7px 9px;
  background:var(--bg);
  color:var(--text);
  font-size:12px;
  outline:none;
  transition:border-color .25s, box-shadow .25s;
}

.status-select:focus{
  border-color:var(--primary);
  box-shadow:0 0 0 3px rgba(99,91,255,.14);
}

.empty{
  padding:55px 20px;
  text-align:center;
  color:var(--muted);
}

.loading{
  padding:50px;
  text-align:center;
  color:var(--muted);
}

@media(min-width:700px){
  .brand strong{
    font-size:31px;
  }

  .brand .logo-mark{
    width:42px;
    height:42px;
    border-radius:14px;
  }
}

@media(max-width:900px){
  .stats{
    grid-template-columns:repeat(2,1fr);
  }

  .toolbar{
    grid-template-columns:1fr;
  }
}

@media(max-width:600px){
  .topbar-inner{
    padding:12px 15px;
  }

  .container{
    padding:22px 15px 40px;
  }

  .hero h1{
    font-size:28px;
  }

  .admin-label{
    display:none;
  }

  .brand strong{
    font-size:18px;
  }

  .logout-btn{
    font-size:12px;
    padding:9px 11px;
  }

  .stats{
    gap:10px;
  }

  .stat{
    padding:17px;
    border-radius:18px;
  }

  .stat-value{
    font-size:24px;
  }

  .stat-label{
    font-size:11px;
  }

  .logo-mark{
    width:36px;
    height:36px;
  }

  .logo-text{
    font-size:28px;
    line-height:36px;
    height:36px;
  }

  .login-card h1{
    font-size:18px;
  }
}

.toast{
  position:fixed;
  right:20px;
  bottom:20px;
  z-index:100;
  padding:14px 17px;
  border-radius:14px;
  background:#151827;
  color:white;
  box-shadow:0 15px 40px rgba(0,0,0,.25);
  transform:translateY(20px);
  opacity:0;
  pointer-events:none;
  transition:.25s;
  font-size:13px;
}

.toast.show{
  transform:translateY(0);
  opacity:1;
}

</style>
</head>

<body class="dark">

<!-- =========================
     LOGIN PAGE
========================= -->

<section id="loginPage">

  <div class="login-card">

    <div class="logo">
      <div class="logo-mark"></div>

      <div class="logo-text">
        Fixi
      </div>
    </div>

    <h1>ADMIN LOGIN</h1>

    <div class="field">
      <label for="email">Email</label>
      <div class="input-wrap">
        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter">
          <rect x="2" y="4" width="20" height="16" rx="1"/>
          <path d="m3 7 9 6 9-6"/>
        </svg>
        <input
          id="email"
          type="email"
          placeholder="admin@example.com"
          autocomplete="email"
        >
      </div>
    </div>

    <div class="field">
      <label for="password">Password</label>
      <div class="input-wrap">
        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter">
          <rect x="4" y="10" width="16" height="11" rx="1"/>
          <path d="M8 10V7a4 4 0 0 1 8 0v3"/>
        </svg>
        <input
          id="password"
          type="password"
          placeholder="••••••••"
          autocomplete="current-password"
          oninput="handlePasswordInput()"
        >
        <button
          type="button"
          class="toggle-eye"
          id="toggleEye"
          aria-label="Toggle password visibility"
          onclick="togglePasswordVisibility()"
        >
          <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
    </div>

    <button
      id="loginBtn"
      class="primary-btn"
      onclick="login()"
    >
      Sign in
    </button>

    <div
      id="loginError"
      class="error"
    ></div>

  </div>

</section>


<!-- =========================
     DASHBOARD
========================= -->

<section id="dashboard">

  <header class="topbar">

    <div class="topbar-inner">

      <div class="brand">

        <div class="logo-mark">
          <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M 50 22 L 78 46 L 71 46 L 71 76 Q 71 78 69 78 L 31 78 Q 29 78 29 76 L 29 46 L 22 46 Z" fill="currentColor"/>
            <path d="M 38 60 L 47 69 L 63 51" stroke="#4f46e5" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          </svg>
        </div>

        <div>
          <strong>Fixi</strong>

          <span class="admin-label">
            Admin Dashboard
          </span>
        </div>

      </div>


      <div class="top-actions">

        <button
          class="icon-btn"
          onclick="toggleDark()"
          title="Toggle theme"
        >
          ◐
        </button>

        <button
          class="logout-btn"
          onclick="logout()"
        >
          Logout
        </button>

      </div>

    </div>

  </header>


  <main class="container">

    <div class="hero">

      <h1>Bookings</h1>

      <p>
        Manage customer requests received through Fixi.
      </p>

    </div>


    <div class="stats">

      <div class="stat">
        <div class="stat-label">Total Bookings</div>
        <div class="stat-value" id="totalCount">0</div>
      </div>

      <div class="stat">
        <div class="stat-label">Pending</div>
        <div class="stat-value" id="pendingCount">0</div>
      </div>

      <div class="stat">
        <div class="stat-label">Confirmed</div>
        <div class="stat-value" id="confirmedCount">0</div>
      </div>

      <div class="stat">
        <div class="stat-label">Completed</div>
        <div class="stat-value" id="completedCount">0</div>
      </div>

    </div>


    <div class="toolbar">

      <input
        id="searchInput"
        class="search-input"
        type="text"
        placeholder="Search name, phone, service, wilaya..."
        oninput="renderBookings()"
      >

      <select
        id="statusFilter"
        class="filter-select"
        onchange="renderBookings()"
      >
        <option value="all">All statuses</option>
        <option value="pending">Pending</option>
        <option value="confirmed">Confirmed</option>
        <option value="completed">Completed</option>
        <option value="cancelled">Cancelled</option>
      </select>

      <select
        id="wilayaFilter"
        class="filter-select"
        onchange="renderBookings()"
      >
        <option value="all">All wilayas</option>
      </select>

    </div>


    <div class="panel">

      <div id="loading" class="loading">
        Loading bookings...
      </div>

      <div id="empty" class="empty" style="display:none">
        No bookings found.
      </div>

      <div id="tableWrap" class="table-wrap" style="display:none">

        <table>

          <thead>
            <tr>
             <th>Customer</th>
             <th>Service / Artisan</th>
             <th>Location</th>
             <th>Problem</th>
             <th>Appointment</th>
             <th>Booked At</th>
             <th>Status</th>
             <th>Actions</th>
            </tr>
          </thead>

          <tbody id="bookingsTableBody">
          </tbody>

        </table>

      </div>

    </div>

  </main>

</section>


<div id="toast" class="toast"></div>


<script>

const SUPABASE_URL =
  'https://yzeemgbkeorkummqfzmx.supabase.co';

const SUPABASE_ANON_KEY =
  'sb_publishable_CzzPIrC6ZjLrVT9-U8ndEg_9-7PTnr7';

let supabaseClient = null;

if (
  typeof supabase !== 'undefined' &&
  supabase.createClient
) {
  supabaseClient =
    supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );
}

let allBookings = [];
let realtimeChannel = null;

(function forceDarkTheme(){
  document.body.classList.add('dark');
})();

function toggleDark(){
  document.body.classList.toggle('dark');
}

/* Show/hide the eye icon based on whether the password field has content */
function handlePasswordInput(){
  const input = document.getElementById('password');
  const eye = document.getElementById('toggleEye');
  if(!input || !eye) return;

  if(input.value.length > 0){
    eye.classList.add('visible');
  }else{
    eye.classList.remove('visible');
    /* Reset to hidden state when field is emptied */
    if(input.type === 'text'){
      input.type = 'password';
      const icon = document.getElementById('eyeIcon');
      if(icon){
        icon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
      }
    }
  }
}

/* Password visibility toggle */
function togglePasswordVisibility(){
  const input = document.getElementById('password');
  const icon = document.getElementById('eyeIcon');
  if(!input || !icon) return;

  if(input.type === 'password'){
    input.type = 'text';
    icon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
  }else{
    input.type = 'password';
    icon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
  }
}

function showToast(message){
  const toast = document.getElementById('toast');
  if(!toast) return;
  toast.textContent = message;
  toast.classList.add('show');
  setTimeout(() => {
    toast.classList.remove('show');
  },3000);
}

document.addEventListener('DOMContentLoaded', () => {
  const emailInput = document.getElementById('email');
  const passwordInput = document.getElementById('password');

  [emailInput,passwordInput].forEach(input => {
    if(input){
      input.addEventListener('keydown', event => {
        if(event.key === 'Enter'){ login(); }
      });
    }
  });

  checkSession();
});

async function checkSession(){
  if(!supabaseClient){
    console.error('Supabase client is not initialized.');
    return;
  }

  try{
    const {data, error} = await supabaseClient.auth.getSession();
    if(error){ console.error('Session check error:', error); return; }
    const session = data?.session;
    if(session){ showDashboard(); }
  }catch(error){
    console.error('Session check failed:', error);
  }
}

async function login(){
  const emailInput = document.getElementById('email');
  const passwordInput = document.getElementById('password');
  const errorDiv = document.getElementById('loginError');
  const loginBtn = document.getElementById('loginBtn');

  const email = emailInput ? emailInput.value.trim() : '';
  const password = passwordInput ? passwordInput.value : '';

  errorDiv.textContent = '';

  if(!email || !password){
    errorDiv.textContent = 'Please enter both email and password.';
    return;
  }

  if(!supabaseClient){
    errorDiv.textContent = 'Supabase client is not initialized. Please check the Supabase configuration.';
    return;
  }

  try{
    loginBtn.disabled = true;
    loginBtn.textContent = 'Signing in...';

    const {data, error} = await supabaseClient.auth.signInWithPassword({
      email: email,
      password: password
    });

    if(error){
      console.error('Supabase login error:', error);
      errorDiv.textContent = error.message || 'Invalid email or password.';
      return;
    }

    if(data && data.session){
      errorDiv.textContent = '';
      showDashboard();
    }else{
      errorDiv.textContent = 'Login failed. No active session was created.';
    }
  }catch(error){
    console.error('Unexpected login error:', error);
    errorDiv.textContent = 'An unexpected error occurred. Please try again.';
  }finally{
    loginBtn.disabled = false;
    loginBtn.textContent = 'Sign in';
  }
}

function showDashboard(){
  const loginPage = document.getElementById('loginPage');
  const dashboard = document.getElementById('dashboard');

  loginPage.style.display = 'none';
  dashboard.style.display = 'block';

  fetchBookings();
  subscribeToBookingsRealtime();
}

async function logout(){
  try{
    if(realtimeChannel && supabaseClient){
      await supabaseClient.removeChannel(realtimeChannel);
      realtimeChannel = null;
    }
  }catch(e){}

  try{
    if(supabaseClient){
      await supabaseClient.auth.signOut();
    }
  }catch(error){
    console.error('Logout error:', error);
  }

  document.getElementById('dashboard').style.display = 'none';
  document.getElementById('loginPage').style.display = 'flex';
  document.getElementById('email').value = '';
  document.getElementById('password').value = '';
  document.getElementById('loginError').textContent = '';
}

function subscribeToBookingsRealtime(){
  if(!supabaseClient || realtimeChannel){ return; }

  try{
    realtimeChannel = supabaseClient
      .channel('fixi-admin-bookings')
      .on('postgres_changes',
        {event:'*',schema:'public',table:'bookings'},
        payload => {
          if(payload.eventType === 'INSERT'){
            const row = payload.new;
            const exists = allBookings.some(b => String(b.id) === String(row.id));
            if(!exists){
              allBookings.unshift(row);
              populateWilayaFilter();
              renderBookings();
              showToast('New booking received');
            }
          }else if(payload.eventType === 'UPDATE'){
            allBookings = allBookings.map(b => {
              if(String(b.id) === String(payload.new.id)){
                return { ...b, ...payload.new };
              }
              return b;
            });
            renderBookings();
          }else if(payload.eventType === 'DELETE'){
            allBookings = allBookings.filter(b => String(b.id) !== String(payload.old.id));
            populateWilayaFilter();
            renderBookings();
          }
        }
      ).subscribe();
  }catch(err){
    console.warn('Realtime subscription failed:', err);
  }
}

async function fetchBookings(){
  const loadingEl = document.getElementById('loading');
  const emptyEl = document.getElementById('empty');
  const tableWrap = document.getElementById('tableWrap');

  loadingEl.style.display = 'block';
  loadingEl.textContent = 'Loading bookings...';
  emptyEl.style.display = 'none';
  tableWrap.style.display = 'none';

  try{
    if(!supabaseClient){
      throw new Error('Supabase client is not initialized.');
    }

    const {data, error} = await supabaseClient
      .from('bookings')
      .select('*')
      .order('created_at', {ascending:false});

    if(error){ throw error; }

    allBookings = data || [];
    console.log('BOOKINGS FROM SUPABASE:', allBookings);
    populateWilayaFilter();
    renderBookings();
  }catch(error){
    console.error('Error fetching bookings:', error);
    loadingEl.textContent = 'Failed to load bookings: ' + (error?.message || 'Unknown error');
  }
}

function populateWilayaFilter(){
  const wilayaFilter = document.getElementById('wilayaFilter');
  if(!wilayaFilter) return;

  const wilayas = [...new Set(allBookings.map(b => b.wilaya).filter(Boolean))].sort();
  const current = wilayaFilter.value || 'all';

  wilayaFilter.innerHTML = '<option value="all">All wilayas</option>';

  wilayas.forEach(wilaya => {
    const option = document.createElement('option');
    option.value = wilaya;
    option.textContent = wilaya;
    wilayaFilter.appendChild(option);
  });

  if([...wilayaFilter.options].some(o => o.value === current)){
    wilayaFilter.value = current;
  }
}

function renderBookings(){
  const loadingEl = document.getElementById('loading');
  const emptyEl = document.getElementById('empty');
  const tableWrap = document.getElementById('tableWrap');
  const tbody = document.getElementById('bookingsTableBody');

  const search = (document.getElementById('searchInput')?.value || '').toLowerCase().trim();
  const statusFilter = document.getElementById('statusFilter')?.value || 'all';
  const wilayaFilter = document.getElementById('wilayaFilter')?.value || 'all';

  const filtered = allBookings.filter(item => {
    const name = String(item.name || '').toLowerCase();
    const phone = String(item.phone || '').toLowerCase();
    const service = String(item.service || '').toLowerCase();
    const wilaya = String(item.wilaya || '').toLowerCase();
    const delegation = String(item.delegation || '').toLowerCase();

    const matchesSearch = !search ||
  name.includes(search) ||
  phone.includes(search) ||
  service.includes(search) ||
  wilaya.includes(search) ||
  delegation.includes(search);

    const matchesStatus = statusFilter === 'all' || item.status === statusFilter;
    const matchesWilaya = wilayaFilter === 'all' || item.wilaya === wilayaFilter;

    return matchesSearch && matchesStatus && matchesWilaya;
  });

  updateStats();
  loadingEl.style.display = 'none';

  if(filtered.length === 0){
    emptyEl.style.display = 'block';
    tableWrap.style.display = 'none';
    tbody.innerHTML = '';
    return;
  }

  emptyEl.style.display = 'none';
  tableWrap.style.display = 'block';

  tbody.innerHTML = filtered.map(b => `
    <tr>
      <td>
        <div class="customer-name">${escapeHtml(b.name || 'N/A')}</div>
        <div class="customer-phone">${escapeHtml(b.phone || '')}</div>
        <div class="customer-email">${escapeHtml(b.email || '')}</div>
      </td>
      <td>
  <div class="customer-name">${escapeHtml(b.service || 'N/A')}</div>
  <div class="customer-phone">
    ${escapeHtml(b.artisan_name || 'Not selected')}
  </div>
</td>
      <td>
  <div>
  ${escapeHtml(b.wilaya || 'N/A')}${b.delegation ? ' - ' + escapeHtml(b.delegation) : ''}
</div>
</td>

<td>
  <div class="problem-text">
    ${escapeHtml(b.problem || 'No problem specified')}
  </div>
</td>

<td>
  <div>${escapeHtml(b.date || b.booking_date || '')}</div>
  <div class="customer-phone">
    ${escapeHtml(b.time || b.booking_time || '')}
  </div>
</td>
      <td>
  <div>
    ${b.created_at ? new Date(b.created_at).toLocaleDateString() : 'N/A'}
  </div>
  <div class="customer-phone">
    ${b.created_at ? new Date(b.created_at).toLocaleTimeString([], {
      hour: '2-digit',
      minute: '2-digit'
    }) : ''}
  </div>
</td>
      <td>
        <span class="status ${escapeHtml(b.status || 'pending')}">
          ${escapeHtml(b.status || 'pending')}
        </span>
      </td>
      <td>
        <select
          class="status-select"
          onchange="updateBookingStatus('${escapeHtml(b.id)}', this.value)"
        >
          <option value="pending" ${b.status === 'pending' ? 'selected' : ''}>Pending</option>
          <option value="confirmed" ${b.status === 'confirmed' ? 'selected' : ''}>Confirmed</option>
          <option value="completed" ${b.status === 'completed' ? 'selected' : ''}>Completed</option>
          <option value="cancelled" ${b.status === 'cancelled' ? 'selected' : ''}>Cancelled</option>
        </select>
      </td>
    </tr>
  `).join('');
}

async function updateBookingStatus(id, newStatus){
  try{
    if(!supabaseClient){
      throw new Error('Supabase client is not initialized.');
    }

    const {error} = await supabaseClient
      .from('bookings')
      .update({status:newStatus})
      .eq('id', id);

    if(error){ throw error; }

    const booking = allBookings.find(b => String(b.id) === String(id));
    if(booking){ booking.status = newStatus; }

    renderBookings();
    showToast('Status updated successfully');
  }catch(error){
    console.error('Error updating status:', error);
    showToast('Failed to update status');
  }
}

function updateStats(){
  document.getElementById('totalCount').textContent = allBookings.length;
  document.getElementById('pendingCount').textContent = allBookings.filter(b => b.status === 'pending').length;
  document.getElementById('confirmedCount').textContent = allBookings.filter(b => b.status === 'confirmed').length;
  document.getElementById('completedCount').textContent = allBookings.filter(b => b.status === 'completed').length;
}

function escapeHtml(str){
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

</script>

</body>
</html>
